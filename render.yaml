services:
  - type: web
    name: gimnasio-fidelizacion
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Gimnasio Titán
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Se piden al crear el servicio (ver README)
      - key: APP_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      # Módulos visibles (tablero Kanban terminado al 25/11/2026). Vacío = todo el sistema.
      - key: SPRINT_MODULOS
        value: socios,planes,suscripciones,pagos,promociones,puntos,premios,canjes,niveles,grupos,vencimientos,renovar-aviso,indicadores,portal,portal-membresia,portal-planes,portal-promociones,portal-historial,usuarios,reportes
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gimnasio-db
          property: connectionString

databases:
  - name: gimnasio-db
    plan: free
    databaseName: gimnasio_fidelizacion
    user: gimnasio
